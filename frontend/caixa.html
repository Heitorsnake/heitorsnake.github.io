<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FilaLivre — Terminal do Caixa</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topo">
    <div class="logo">FILA<span>LIVRE</span></div>
    <div class="subtitulo-topo">Terminal de Caixa</div>
    <div class="espaco"></div>
    <div class="usuario-info">
      <strong id="nome-usuario"></strong>
      <span class="perfil-badge">Operador</span>
    </div>
    <button class="btn btn-sair btn-pequeno" onclick="sair()">Sair</button>
  </header>

  <main class="conteudo">

    <div class="banner-decisao" id="banner-decisao"></div>
    <div class="aguardando-gestor" id="aguardando-gestor">
      ⏳ Solicitação enviada. Aguardando decisão do gestor…
    </div>

    <div class="caixa-layout">

      <aside class="cartao painel-status">
        <div class="campo">
          <label for="select-caixa">Seu caixa</label>
          <select id="select-caixa"><option value="">Carregando…</option></select>
        </div>

        <span class="status-chip status-NORMAL" id="chip-status">—</span>

        <div>
          <div class="rotulo" style="font-size:.72rem;text-transform:uppercase;color:var(--texto-fraco);letter-spacing:1px;">
            Total da compra
          </div>
          <div class="total-grande" id="total-compra">R$ 0,00</div>
        </div>

        <div class="caixa-detalhe"><span>Itens registrados</span><strong id="qtd-itens">0</strong></div>
        <div class="caixa-detalhe"><span>Tempo de atendimento</span><strong id="tempo-atendimento">–</strong></div>

        <button class="btn btn-verde" id="btn-iniciar">Iniciar atendimento</button>
        <button class="btn btn-amarelo" id="btn-espera" disabled>Colocar em espera / Retomar</button>
        <button class="btn btn-vermelho" id="btn-finalizar" disabled>Finalizar venda</button>
        <button class="btn btn-azul" id="btn-solicitar" disabled disabled-title="">Solicitar autorização</button>
      </aside>

      <section class="secao cartao">
        <h2>Carrinho da compra (simulação)</h2>
        <form class="linha-form" id="form-item">
          <input type="text" id="item-nome" placeholder="Produto (ex.: Arroz 5kg)" required maxlength="60">
          <input type="number" id="item-preco" placeholder="Preço R$" min="0.01" step="0.01" required>
          <input type="number" id="item-qtd" placeholder="Qtd" min="1" step="1" value="1" required>
          <button type="submit" class="btn btn-cinza">Registrar</button>
        </form>

        <div id="lista-itens">
          <div class="vazio">Nenhum produto registrado ainda.</div>
        </div>
      </section>

    </div>
  </main>

  <dialog id="dialog-solicitacao">
    <h3>Solicitar autorização ao gestor</h3>
    <div class="mensagem-erro" id="erro-solicitacao"></div>
    <form method="dialog" id="form-solicitacao">
      <div class="campo">
        <label for="sol-tipo">Tipo de solicitação</label>
        <select id="sol-tipo">
          <option value="CANCELAMENTO">Cancelamento de item</option>
          <option value="DESCONTO">Aplicar desconto</option>
          <option value="CUPOM">Validar cupom</option>
        </select>
      </div>
      <div class="campo">
        <label for="sol-produto">Produto</label>
        <input type="text" id="sol-produto" required maxlength="60" placeholder="Ex.: Arroz 5kg">
      </div>
      <div class="linha-form">
        <div class="campo">
          <label for="sol-qtd">Quantidade</label>
          <input type="number" id="sol-qtd" min="1" step="1" value="1" required>
        </div>
        <div class="campo">
          <label for="sol-valor">Valor (R$)</label>
          <input type="number" id="sol-valor" min="0.01" step="0.01" required>
        </div>
      </div>
      <div class="campo">
        <label for="sol-motivo">Motivo da solicitação</label>
        <textarea id="sol-motivo" rows="2" maxlength="300" placeholder="Ex.: cliente desistiu do produto"></textarea>
      </div>
      <div class="dialog-acoes">
        <button type="button" class="btn btn-cinza" onclick="document.getElementById('dialog-solicitacao').close()">Cancelar</button>
        <button type="submit" class="btn btn-azul">Enviar solicitação</button>
      </div>
    </form>
  </dialog>

  <script src="js/api.js"></script>
  <script src="js/caixa.js"></script>
</body>
</html>
