server:
  port: 8080

spring:
  application:
    name: filalivre
  datasource:
    url: jdbc:h2:file:${FILALIVRE_DB_PATH:../database/filalivre};AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console
  web:
    resources:
      static-locations: classpath:/static/, file:${FILALIVRE_FRONTEND_PATH:../frontend}/
  mvc:
    throw-exception-if-no-handler-found: true

filalivre:
  versao: 1.0.0
